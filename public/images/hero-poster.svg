<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Salón de celebraciones">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="38%" stop-color="#1A1208"/>
      <stop offset="68%" stop-color="#2D2416"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#C9A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D2416" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0806" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B85C"/>
      <stop offset="100%" stop-color="#A88A3A"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Arches -->
  <g fill="none" stroke="#C9A84C" stroke-opacity="0.18" stroke-width="2">
    <path d="M150 760 V360 a150 150 0 0 1 300 0 V760"/>
    <path d="M650 760 V330 a150 150 0 0 1 300 0 V760"/>
    <path d="M1150 760 V360 a150 150 0 0 1 300 0 V760"/>
  </g>

  <!-- Chandeliers -->
  <g>
    <g transform="translate(300,150)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#C9A84C" stroke-opacity="0.5" stroke-width="2"/>
      <ellipse cx="0" cy="90" rx="70" ry="26" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="-55" cy="92" r="22" fill="url(#bulb)"/>
      <circle cx="0" cy="98" r="26" fill="url(#bulb)"/>
      <circle cx="55" cy="92" r="22" fill="url(#bulb)"/>
    </g>
    <g transform="translate(800,110)">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#C9A84C" stroke-opacity="0.5" stroke-width="2"/>
      <ellipse cx="0" cy="100" rx="90" ry="32" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="2.5"/>
      <circle cx="-70" cy="103" r="24" fill="url(#bulb)"/>
      <circle cx="0" cy="112" r="30" fill="url(#bulb)"/>
      <circle cx="70" cy="103" r="24" fill="url(#bulb)"/>
    </g>
    <g transform="translate(1300,150)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#C9A84C" stroke-opacity="0.5" stroke-width="2"/>
      <ellipse cx="0" cy="90" rx="70" ry="26" fill="none" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="-55" cy="92" r="22" fill="url(#bulb)"/>
      <circle cx="0" cy="98" r="26" fill="url(#bulb)"/>
      <circle cx="55" cy="92" r="22" fill="url(#bulb)"/>
    </g>
  </g>

  <!-- Banquet tables -->
  <g opacity="0.9">
    <ellipse cx="800" cy="720" rx="220" ry="60" fill="#1A1208"/>
    <ellipse cx="800" cy="700" rx="220" ry="55" fill="#F8F3E6" fill-opacity="0.08" stroke="#C9A84C" stroke-opacity="0.3"/>
    <ellipse cx="380" cy="800" rx="180" ry="48" fill="#F8F3E6" fill-opacity="0.06" stroke="#C9A84C" stroke-opacity="0.22"/>
    <ellipse cx="1230" cy="800" rx="180" ry="48" fill="#F8F3E6" fill-opacity="0.06" stroke="#C9A84C" stroke-opacity="0.22"/>
    <!-- centerpieces -->
    <circle cx="800" cy="700" r="10" fill="url(#bulb)"/>
    <circle cx="380" cy="800" r="8" fill="url(#bulb)"/>
    <circle cx="1230" cy="800" r="8" fill="url(#bulb)"/>
  </g>

  <rect y="560" width="1600" height="340" fill="url(#floor)"/>
</svg>
