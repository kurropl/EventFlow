    <g transform="translate(300,520)"><rect x="-6" y="0" width="12" height="60" rx="3" fill="#F8F3E6" fill-opacity="0.5"/><circle cx="0" cy="-6" r="20" fill="url(#s5b)"/><circle cx="0" cy="-4" r="5" fill="#FFF6D8"/></g>
    <g transform="translate(400,500)"><rect x="-7" y="0" width="14" height="80" rx="3" fill="#F8F3E6" fill-opacity="0.55"/><circle cx="0" cy="-8" r="26" fill="url(#s5b)"/><circle cx="0" cy="-5" r="6" fill="#FFF6D8"/></g>
    <g transform="translate(500,520)"><rect x="-6" y="0" width="12" height="60" rx="3" fill="#F8F3E6" fill-opacity="0.5"/><circle cx="0" cy="-6" r="20" fill="url(#s5b)"/><circle cx="0" cy="-4" r="5" fill="#FFF6D8"/></g>
  </g>
  <!-- soft hanging bulbs -->
  <g fill="url(#s5b)"><circle cx="160" cy="240" r="14"/><circle cx="640" cy="220" r="14"/><circle cx="250" cy="160" r="10"/><circle cx="560" cy="150" r="10"/></g>
