<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sala Íntima">
  <defs>
    <linearGradient id="s5bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1d0f"/><stop offset="55%" stop-color="#4a3318"/><stop offset="100%" stop-color="#160d05"/>
    </linearGradient>
    <radialGradient id="s5g" cx="50%" cy="60%" r="55%"><stop offset="0%" stop-color="#E8B964" stop-opacity="0.4"/><stop offset="100%" stop-color="#E8B964" stop-opacity="0"/></radialGradient>
    <radialGradient id="s5b" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFE9B0" stop-opacity="1"/><stop offset="100%" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#s5bg)"/><rect width="800" height="800" fill="url(#s5g)"/>
  <!-- table runner -->
  <ellipse cx="400" cy="600" rx="260" ry="80" fill="#F8F3E6" fill-opacity="0.08" stroke="#C9A84C" stroke-opacity="0.3"/>
  <!-- candles -->
