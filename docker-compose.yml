services:
# ---- Next.js App (bind mount, no Docker build needed) ----
  eventflow:
    image: node:20-alpine
    container_name: eventflow
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    working_dir: /app
    command: npx next start
    volumes:
      - .:/app
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- Supabase Auth ----
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: eventflow-auth
    restart: unless-stopped
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3020
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- Supabase API ----
  api:
    image: supabase/postgres-meta:v0.83.2
    container_name: eventflow-api
    restart: unless-stopped
    environment:
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- Supabase Realtime ----
  realtime:
    image: supabase/realtime:v2.57.1
    container_name: eventflow-realtime
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET}
      API_JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- Supabase Storage ----
  storage:
    image: supabase/storage-api:latest
    container_name: eventflow-storage
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      POSTGREST_URL: http://postgrest:3000
      PGBODY_MAX: 10485760
      FILE_SIZE_LIMIT: 5242880
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- PostgREST ----
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: eventflow-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - eventflow-net
    depends_on:
      - postgres

  # ---- Postgres ----
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - eventflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  eventflow-net:
    driver: bridge

volumes:
  postgres_data:
